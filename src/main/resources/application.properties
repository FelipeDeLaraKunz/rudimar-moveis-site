#Servidor
server.port=${PORT:8080}
# "native" ativa o RemoteIpValve do proprio Tomcat: ele so confia no header
# X-Forwarded-For quando a conexao chega de um IP interno/privado (rede do Docker,
# localhost etc - e onde o Nginx da VPS fica), e a partir dele reescreve
# request.getRemoteAddr() com o IP real do visitante. Deixa de ser possivel um cliente
# externo forjar o header direto pra escapar do rate limit, porque so o hop confiavel
# (o proprio Nginx) pode setar esse header de forma que o Tomcat aceite.
server.forward-headers-strategy=native

# Limites do Tomcat pensados para um servidor com pouca RAM (2GB): menos
# threads/conexoes simultaneas processando ao mesmo tempo = menos memoria em uso
# sob uma rajada de requisicoes, evitando o processo ser derrubado por falta de RAM.
# Acima do accept-count, novas conexoes sao recusadas na hora em vez de empilhar.
server.tomcat.threads.max=50
server.tomcat.threads.min-spare=10
server.tomcat.max-connections=200
server.tomcat.accept-count=50
server.tomcat.connection-timeout=20000

#Banco de dados (Postgres)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/loja_moveis}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

#JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

