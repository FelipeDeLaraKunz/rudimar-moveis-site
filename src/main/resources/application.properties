#Servidor
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# Limites do Tomcat pensados para um servidor com pouca RAM (2GB): menos
# threads/conexoes simultaneas processando ao mesmo tempo = menos memoria em uso
# sob uma rajada de requisicoes, evitando o processo ser derrubado por falta de RAM.
# Acima do accept-count, novas conexoes sao recusadas na hora em vez de empilhar.
server.tomcat.threads.max=50
server.tomcat.threads.min-spare=10
server.tomcat.max-connections=200
server.tomcat.accept-count=50
server.tomcat.connection-timeout=20000

#Banco de dados (Postgres)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/loja_moveis}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

#JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

#Usuario administrador
