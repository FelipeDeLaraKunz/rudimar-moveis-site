#Upload de imagens
app.upload-dir=${APP_UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
# Sem isso, quando o upload passa do limite acima o Spring Security tenta ler o token
# CSRF do corpo multipart antes mesmo do controller rodar, a leitura falha por causa do
# limite excedido, e o erro vira um 403 generico (parece falha de CSRF) em vez da
# mensagem amigavel tratada em AdminController. Com resolve-lazily=true o multipart so
# e processado dentro do controller, onde o MaxUploadSizeExceededException e tratado de
# verdade.
spring.servlet.multipart.resolve-lazily=true

#Nome do app (aparece em logs)
spring.application.name=rudimar-moveis-site
