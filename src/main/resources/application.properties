#Servidor
server.port=${PORT:8080}

#Banco de dados (Postgres)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/loja_moveis}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

#JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

#Usuario administrador
admin.username=${ADMIN_USERNAME:admin}
admin.password=${ADMIN_PASSWORD:testelocal}

#Dados de contato da loja
loja.whatsapp=${LOJA_WHATSAPP:5549984372223}
loja.telefone-exibicao=${LOJA_TELEFONE_EXIBICAO:3304.5830}

#Endereco
loja.endereco=${LOJA_ENDERECO:Rua Marechal Deodoro da Fonseca, 169D, Centro}

#Redes sociais
loja.instagram=${LOJA_INSTAGRAM:https://instagram.com/rudimarmoveis}
loja.facebook=${LOJA_FACEBOOK:https://facebook.com/rudimarmoveis}

#Upload de imagens
app.upload-dir=${APP_UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=40MB

#Nome do app (aparece em logs)
spring.application.name=rudimar-moveis-site

# ---- Automacao n8n para gerar nome/descricao/cor/categoria/marca/imagens do produto ----
n8n.webhook-url=${N8N_WEBHOOK_URL:http://localhost:5678/webhook/b07582e1-cc1d-4ff2-933a-f69668cb20c6}

# ---- API de automacao (ex: n8n) para criar produtos programaticamente ----
automacao.api-key=${AUTOMACAO_API_KEY:}
