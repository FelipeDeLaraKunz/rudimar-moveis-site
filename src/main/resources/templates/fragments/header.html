<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<th:block th:fragment="header(paginaAtiva)">
<header class="header">
    <div class="container header-top">
        <a th:href="@{/}" class="brand"><img src="/uploads/logo.png" alt="Rudimar Móveis"></a>

        <button type="button" class="nav-toggle" id="navToggle" aria-label="Abrir menu" aria-expanded="false" aria-controls="headerMenu">
            <span></span><span></span><span></span>
        </button>

        <div class="header-menu" id="headerMenu">
            <nav class="nav">
                <a th:href="@{/promocoes}" th:classappend="${paginaAtiva == 'promocoes'} ? 'nav-ativo' : ''">Promoções</a>
                <a th:href="@{/produtos}" th:classappend="${paginaAtiva == 'produtos'} ? 'nav-ativo' : ''">Produtos</a>
                <a th:href="@{/#sobre}">A loja</a>
            </nav>

            <form th:action="@{/produtos}" method="get" class="nav-search">
                <input type="search" name="busca" placeholder="Buscar produtos..." aria-label="Buscar produtos" th:value="${buscaInicial}">
                <button type="submit" aria-label="Buscar">
                    <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="7"/>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                    </svg>
                </button>
            </form>

            <div class="nav-social">
                <a th:href="${lojaInstagram}" target="_blank" rel="noopener" class="nav-social-link" aria-label="Instagram da Rudimar Móveis">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="18" height="18" rx="5"/>
                        <circle cx="12" cy="12" r="4"/>
                        <circle cx="17.2" cy="6.8" r="1.1" fill="currentColor" stroke="none"/>
                    </svg>
                </a>
                <a th:href="${lojaFacebook}" target="_blank" rel="noopener" class="nav-social-link" aria-label="Facebook da Rudimar Móveis">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="9"/>
                        <path d="M13.5 21v-6.5h2.2l.3-2.6h-2.5V10c0-.75.2-1.3 1.3-1.3h1.4V6.4c-.25-.03-1.1-.1-2.1-.1-2.1 0-3.5 1.28-3.5 3.6v2h-2.3v2.6h2.3V21"/>
                    </svg>
                </a>
                <a th:href="@{https://wa.me/{numero}(numero=${lojaWhatsapp})}" target="_blank" rel="noopener" class="nav-social-link" aria-label="WhatsApp da Rudimar Móveis">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                        <path d="M17 14.2c-.3-.1-1.6-.8-1.9-.9-.3-.1-.4-.1-.6.1-.2.3-.7.9-.8 1-.2.2-.3.2-.5.1-.3-.1-1.2-.4-2.2-1.4-.8-.7-1.4-1.6-1.5-1.9-.2-.3 0-.5.1-.6.1-.1.3-.3.4-.5.1-.1.2-.3.2-.4.1-.2 0-.3 0-.5-.1-.1-.6-1.5-.8-2-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.5.1-.7.3-.2.3-.9.9-.9 2.2s1 2.6 1.1 2.8c.1.2 2 3 4.7 4.2.7.3 1.2.5 1.6.6.7.2 1.3.2 1.8.1.5-.1 1.6-.7 1.9-1.3.2-.6.2-1.1.2-1.3-.1-.1-.3-.2-.5-.3z"/>
                        <path d="M12 3C7 3 3 7 3 12c0 1.7.5 3.4 1.4 4.8L3 21l4.3-1.4C8.7 20.5 10.3 21 12 21c5 0 9-4 9-9s-4-9-9-9zm0 16.3c-1.5 0-3-.4-4.2-1.2l-.3-.2-3 1 1-2.9-.2-.3C4.4 15 4 13.5 4 12c0-4.4 3.6-8 8-8s8 3.6 8 8-3.6 8-8 8z"/>
                    </svg>
                </a>
            </div>
        </div>
    </div>
</header>

<a th:if="${lojaWhatsapp}" class="whatsapp-flutuante"
   th:href="@{https://wa.me/{numero}(numero=${lojaWhatsapp})}" target="_blank" rel="noopener"
   aria-label="Falar no WhatsApp">
    <svg viewBox="0 0 32 32" width="28" height="28" fill="currentColor" aria-hidden="true">
        <path d="M16 3C9.4 3 4 8.4 4 15c0 2.2.6 4.3 1.7 6.1L4 29l8.1-1.7C13.8 28 14.9 28 16 28c6.6 0 12-5.4 12-12S22.6 3 16 3zm0 22c-1.1 0-2.2-.2-3.2-.6l-.5-.2-4.8 1 1-4.7-.3-.5C7.2 18.9 6.7 17 6.7 15c0-5.1 4.2-9.3 9.3-9.3s9.3 4.2 9.3 9.3-4.2 9.7-9.3 9.7zm5.1-6.9c-.3-.1-1.6-.8-1.9-.9-.3-.1-.4-.1-.6.1-.2.3-.7.9-.8 1-.2.2-.3.2-.5.1-.3-.1-1.2-.4-2.2-1.4-.8-.7-1.4-1.6-1.5-1.9-.2-.3 0-.5.1-.6.1-.1.3-.3.4-.5.1-.1.2-.3.2-.4.1-.2 0-.3 0-.5-.1-.1-.6-1.5-.8-2-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.5.1-.7.3-.2.3-.9.9-.9 2.2s1 2.6 1.1 2.8c.1.2 2 3 4.7 4.2.7.3 1.2.5 1.6.6.7.2 1.3.2 1.8.1.5-.1 1.6-.7 1.9-1.3.2-.6.2-1.1.2-1.3-.1-.1-.3-.2-.5-.3z"/>
    </svg>
</a>
</th:block>

</body>
</html>
