<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${promocao.titulo} + ' - Rudimar Móveis'">Promoção - Rudimar Móveis</title>
    <link rel="icon" type="image/png" href="/uploads/icone.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/header :: header('promocoes')}"></div>

<section class="catalogo-topo" th:style="'--sale: ' + ${promocao.cor} + ';'">
    <div class="container">
        <a th:href="@{/}" class="voltar-link">&larr; Voltar para a home</a>

        <img th:if="${promocao.imagemUrl}" th:src="${promocao.imagemUrl}" th:alt="${promocao.titulo}" class="promo-detalhe-imagem">

        <p class="hero-eyebrow">Oferta por tempo limitado</p>
        <h1 th:text="${promocao.titulo}"></h1>
        <p class="lead" th:if="${promocao.descricao}" th:text="${promocao.descricao}"></p>

        <div class="promo-detalhe-info">
            <span class="promo-banner-desconto" th:if="${promocao.percentualDesconto != null}" th:text="'-' + ${promocao.percentualDesconto} + '%'"></span>
            <div class="promo-timer promo-timer-banner" th:if="${promocao.validaAteIso != null}" th:attr="data-fim=${promocao.validaAteIso}">
                <span class="promo-timer-label">Termina em</span>
                <span class="promo-timer-valor">--:--:--</span>
            </div>
            <span th:unless="${promocao.validaAteIso != null}" class="promo-timer-label">Sem data para acabar</span>
        </div>
    </div>
</section>

<section class="section" style="padding-top: 24px;">
    <div class="container">
        <p class="catalogo-contagem" th:text="${produtos.size()} + ' produto(s) nesta oferta.'"></p>

        <div th:if="${produtos.isEmpty()}" class="empty-msg">
            Nenhum produto ativo nesta promoção no momento.
        </div>

        <div class="produtos-grid" th:unless="${produtos.isEmpty()}">
            <th:block th:each="produto : ${produtos}">
                <div th:replace="~{fragments/produto-card :: card(${produto}, ${promoPorProduto.get(produto.id)})}"></div>
            </th:block>
        </div>
    </div>
</section>

<script th:src="@{/js/header.js}" defer></script>
<script th:src="@{/js/promo-timer.js}" defer></script>

<footer class="footer">
    <div class="container" style="text-align: center; width: 100%;">
        <span>&copy; 2026 Rudimar Móveis ltda. CNPJ: 22.459.828/0001-45. Todos os direitos reservados.</span>
    </div>
</footer>

</body>
</html>
